version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /client-secret
      - /private-key-jwt
      - /backend-services
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
